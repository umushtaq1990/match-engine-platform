[tool.ruff]
line-length = 110
target-version = "py312"
# Alembic migrations are autogenerated and never hand-edited for style —
# linting them would mean fixing the same cosmetic issues every time a new
# migration is generated, for no benefit.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
