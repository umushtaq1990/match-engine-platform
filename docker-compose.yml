# Pinned so container names (jme-db-1, etc.) are stable regardless of the
# checkout directory name - Compose otherwise derives the project name from
# the folder it's run in, which differs between a local clone ("JME") and a
# CI checkout ("match-engine-platform"), breaking any script (including
# ci.yml's fresh-volume-smoke-test) that references a container by name.
name: jme

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JME_API_KEY: ${JME_API_KEY}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  # One-off job: applies Alembic migrations. Not a long-running service.
  # Run explicitly: docker compose run --rm migrate
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.migrate
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]

  # One-off job: generates synthetic source data. Dev/local only — simulates
  # an upstream data-engineering pipeline, never deployed to production.
  # Run explicitly: docker compose run --rm seed
  seed:
    build:
      context: .
      dockerfile: docker/Dockerfile.seed
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]

  # One-off job: runs data-quality checks over the current source data and
  # records results in data_quality_runs/data_quality_check_results. Its own
  # minimal image (no Faker/Alembic — it only runs read queries). Intended to
  # run after any data load, and on a recurring schedule in production (a
  # Kubernetes CronJob in Phase 12) — never as a long-running container.
  # Run explicitly: docker compose run --rm dataquality
  dataquality:
    build:
      context: .
      dockerfile: docker/Dockerfile.dataquality
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - jme_db_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jme -d jme"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Always-on service (like api/db) — experiment tracking UI/API must be
  # reachable at any time to browse past evaluation runs, not a one-off job.
  # Backend store: a dedicated "mlflow" Postgres database (same instance,
  # separate from "jme" — see docker/postgres-init/01-create-mlflow-db.sql).
  mlflow:
    build:
      context: .
      dockerfile: docker/Dockerfile.mlflow
    ports:
      - "5000:5000"
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${MLFLOW_DB_NAME}
    volumes:
      - mlflow_artifacts:/mlflow-artifacts
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000')"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  jme_db_data:
  mlflow_artifacts:
