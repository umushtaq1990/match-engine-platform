services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://jme:jme_dev_password@db:5432/jme
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  # One-off job: applies Alembic migrations. Not a long-running service.
  # Run explicitly: docker compose run --rm migrate
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.migrate
    environment:
      DATABASE_URL: postgresql+psycopg2://jme:jme_dev_password@db:5432/jme
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]

  # One-off job: generates synthetic source data. Dev/local only — simulates
  # an upstream data-engineering pipeline, never deployed to production.
  # Run explicitly: docker compose run --rm seed
  seed:
    build:
      context: .
      dockerfile: docker/Dockerfile.seed
    environment:
      DATABASE_URL: postgresql+psycopg2://jme:jme_dev_password@db:5432/jme
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]

  # One-off job: runs data-quality checks over the current source data and
  # records results in data_quality_runs/data_quality_check_results. Reuses
  # the ingestion image (same deps), overriding its default command. Intended
  # to run after any data load, and on a recurring schedule in production
  # (a Kubernetes CronJob in Phase 12) — never as a long-running container.
  # Run explicitly: docker compose run --rm dataquality
  dataquality:
    build:
      context: .
      dockerfile: docker/Dockerfile.seed
    command: ["python", "-m", "app.ingestion.data_quality"]
    environment:
      DATABASE_URL: postgresql+psycopg2://jme:jme_dev_password@db:5432/jme
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: jme
      POSTGRES_PASSWORD: jme_dev_password
      POSTGRES_DB: jme
    ports:
      - "5432:5432"
    volumes:
      - jme_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jme -d jme"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  jme_db_data:
