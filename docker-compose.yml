# Pinned so container names (jme-db-1, etc.) are stable regardless of the
# checkout directory name - Compose otherwise derives the project name from
# the folder it's run in, which differs between a local clone ("JME") and a
# CI checkout ("match-engine-platform"), breaking any script (including
# ci.yml's fresh-volume-smoke-test) that references a container by name.
name: jme

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JME_API_KEY: ${JME_API_KEY}
      # Phase 14 instrumentation hook (app/api/analytics_client.py) — best-effort,
      # never blocks on the analytics service, so no depends_on/healthcheck
      # coupling to it here. See docs/behavioral-analytics.md.
      ANALYTICS_URL: http://analytics:8001
      # Phase 21: rate-limit storage, result cache, and Streams producer. See
      # docs/redis-infrastructure.md.
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  # One-off job: applies Alembic migrations. Not a long-running service.
  # Run explicitly: docker compose run --rm migrate
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.migrate
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]

  # One-off job: generates synthetic source data. Dev/local only — simulates
  # an upstream data-engineering pipeline, never deployed to production.
  # Run explicitly: docker compose run --rm seed
  seed:
    build:
      context: .
      dockerfile: docker/Dockerfile.seed
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]

  # One-off job: runs data-quality checks over the current source data and
  # records results in data_quality_runs/data_quality_check_results. Its own
  # minimal image (no Faker/Alembic — it only runs read queries). Intended to
  # run after any data load, and on a recurring schedule in production (a
  # Kubernetes CronJob in Phase 12) — never as a long-running container.
  # Run explicitly: docker compose run --rm dataquality
  dataquality:
    build:
      context: .
      dockerfile: docker/Dockerfile.dataquality
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]

  # Phase 14: behavioral-event tracking service. Always-on (like api) — it's
  # a live ingestion endpoint, not a one-off job. Independent image/schema
  # from the matching engine by design — see docs/behavioral-analytics.md.
  analytics:
    build:
      context: .
      dockerfile: docker/Dockerfile.analytics
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JME_API_KEY: ${JME_API_KEY}
      # Phase 21: rate-limit storage and Streams consumer group. See
      # docs/redis-infrastructure.md.
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  # One-off job: generates synthetic behavioral events (Phase 14) against the
  # already-seeded candidate/job/course ids. Run after `seed`, not instead of
  # it. Run explicitly: docker compose run --rm analytics-seed
  analytics-seed:
    build:
      context: .
      dockerfile: docker/Dockerfile.analytics
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: ["python", "-m", "app.analytics.generate_synthetic_events"]
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]

  # Phase 15: shared LLM/embedding serving layer. Official, unmodified image —
  # no custom Dockerfile, same pattern as db/prometheus/cadvisor/grafana.
  # Always-on (like api/analytics) — it's a live inference endpoint, not a
  # one-off job. No consumers wired up yet in this phase; see
  # docs/model-serving.md.
  ollama:
    image: ollama/ollama:0.40.13
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-off job: pulls every model the live services actually use into the
  # ollama_data volume. Idempotent — `ollama pull` is a no-op if the model is
  # already present. Run explicitly: docker compose run --rm ollama-pull
  #
  # qwen2.5:1.5b — extraction LLM (promoted in Phase 18 over the original
  #   llama3.2:1b after a measured comparison: F1 0.60-0.66 vs 0.504, smaller
  #   on disk too — see docs/skill-extraction.md). llama3.2:1b itself is no
  #   longer pulled by default; still reproducible via
  #   `docker exec <ollama container> ollama pull llama3.2:1b` if needed.
  # nomic-embed-text — extraction's skill-canonicalization embeddings (Phase 16)
  # all-minilm — Phase 17's production entity-embedding model
  ollama-pull:
    image: ollama/ollama:0.40.13
    entrypoint: ["sh", "-c"]
    command:
      - "ollama pull qwen2.5:1.5b && ollama pull nomic-embed-text && ollama pull all-minilm"
    environment:
      OLLAMA_HOST: ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    profiles: ["tools"]

  # Phase 16: Use Case C skill-extraction service. Always-on (like
  # api/analytics) — a live extraction endpoint, not a one-off job. Calls the
  # ollama service over HTTP; no model weights in this image. See
  # docs/skill-extraction.md.
  extraction:
    build:
      context: .
      dockerfile: docker/Dockerfile.extraction
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JME_API_KEY: ${JME_API_KEY}
      OLLAMA_URL: http://ollama:11434
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  # One-off job: runs the skill-extraction evaluation harness
  # (app/extraction/run_extraction_eval.py) against the golden dataset and
  # logs results to MLflow + Postgres. Run explicitly, with optional
  # overrides: docker compose run --rm extraction-eval
  #   python -m app.extraction.run_extraction_eval --llm-model X --threshold T
  extraction-eval:
    build:
      context: .
      dockerfile: docker/Dockerfile.extraction
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      OLLAMA_URL: http://ollama:11434
      MLFLOW_TRACKING_URI: http://mlflow:5000
    command: ["python", "-m", "app.extraction.run_extraction_eval"]
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
    profiles: ["tools"]

  # Phase 17: pgvector/pgvector is a drop-in-compatible build of the same
  # Postgres 16 with the pgvector extension pre-installed (confirmed via
  # Docker Hub's API, not a fork) — not a new vector-DB service, the
  # existing Postgres instance becomes one. See docs/embedding-matching.md.
  # One-off job: computes/refreshes Phase 17 entity embeddings (skills,
  # experience, overall dimensions) for candidates and jobs. Reuses the
  # `extraction` image (already has Ollama access + the skill-embedding
  # cache) rather than a 7th Dockerfile — see docs/embedding-matching.md
  # "Service boundary". Incremental: unchanged entities are skipped via
  # source_hash, not recomputed. Run explicitly, with optional limits for a
  # fast partial pass: docker compose run --rm embeddings-compute
  #   python -m app.embeddings.compute_embeddings --candidate-limit 50 --job-limit 50
  embeddings-compute:
    build:
      context: .
      dockerfile: docker/Dockerfile.extraction
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      OLLAMA_URL: http://ollama:11434
    command: ["python", "-m", "app.embeddings.compute_embeddings"]
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
    profiles: ["tools"]

  # Phase 21: shared Redis instance serving three use cases — rate-limiting
  # backend (fixes Phase 18's measured multi-worker counter-inflation bug),
  # 1-hour result cache (cache-aside on the matching endpoints), and the
  # Streams broker decoupling the analytics instrumentation hook from a
  # synchronous HTTP call. One instance for all three in v1, not three
  # separate deployments — see docs/redis-infrastructure.md.
  redis:
    image: redis:7.4.12-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  db:
    image: pgvector/pgvector:0.8.7-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - jme_db_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jme -d jme"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Always-on service (like api/db) — experiment tracking UI/API must be
  # reachable at any time to browse past evaluation runs, not a one-off job.
  # Backend store: a dedicated "mlflow" Postgres database (same instance,
  # separate from "jme" — see docker/postgres-init/01-create-mlflow-db.sql).
  mlflow:
    build:
      context: .
      dockerfile: docker/Dockerfile.mlflow
    ports:
      - "5000:5000"
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${MLFLOW_DB_NAME}
    volumes:
      - mlflow_artifacts:/mlflow-artifacts
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000')"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Phase 9 observability. Always-on (like mlflow) — needs to be continuously
  # scraping, not a one-off job. Scrapes the api's /metrics (latency/
  # error-rate, from prometheus-fastapi-instrumentator) and cadvisor
  # (per-container CPU/RAM) — covers the brief's "CPU/RAM/latency/error-rate
  # measurable" requirement without hand-rolling container resource metrics.
  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api
      - analytics
      - extraction
      - cadvisor

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    ports:
      - "8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    privileged: true

  grafana:
    image: grafana/grafana:11.3.1
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  # Phase 19: knowledge graph linking candidates/skills/occupations/jobs/
  # courses. Official image, GDS plugin auto-installed at container start
  # (verified real, not assumed — see docs/knowledge-graph.md). Always-on
  # (like ollama) — Neo4j Browser needs to be reachable to explore the
  # graph, not just during a batch job.
  neo4j:
    image: neo4j:5.26.32-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["graph-data-science"]'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # One-off job: idempotent batch sync from Postgres into the Neo4j graph.
  # Run explicitly: docker compose run --rm graph-sync
  graph-sync:
    build:
      context: .
      dockerfile: docker/Dockerfile.graph
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    profiles: ["tools"]

  # One-off job: skill co-occurrence clustering via Neo4j GDS (run after
  # graph-sync). Run explicitly: docker compose run --rm graph-cluster
  graph-cluster:
    build:
      context: .
      dockerfile: docker/Dockerfile.graph
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
    command: ["python", "-m", "app.graph.cluster_skills"]
    depends_on:
      neo4j:
        condition: service_healthy
    profiles: ["tools"]

  # One-off job: Phase 23 candidate/job skill-similarity clustering via
  # Neo4j GDS (run after graph-sync) — same Louvain pattern as graph-cluster,
  # one level up (candidates/jobs, not skills). See docs/knowledge-graph.md.
  # Run explicitly: docker compose run --rm graph-cluster-entities
  graph-cluster-entities:
    build:
      context: .
      dockerfile: docker/Dockerfile.graph
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
    command: ["python", "-m", "app.graph.cluster_entities"]
    depends_on:
      neo4j:
        condition: service_healthy
    profiles: ["tools"]

volumes:
  jme_db_data:
  mlflow_artifacts:
  prometheus_data:
  grafana_data:
  ollama_data:
  neo4j_data:
  redis_data:
