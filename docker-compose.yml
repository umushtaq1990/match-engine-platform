# Pinned so container names (jme-db-1, etc.) are stable regardless of the
# checkout directory name - Compose otherwise derives the project name from
# the folder it's run in, which differs between a local clone ("JME") and a
# CI checkout ("match-engine-platform"), breaking any script (including
# ci.yml's fresh-volume-smoke-test) that references a container by name.
name: jme

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JME_API_KEY: ${JME_API_KEY}
      # Phase 14 instrumentation hook (app/api/analytics_client.py) — best-effort,
      # never blocks on the analytics service, so no depends_on/healthcheck
      # coupling to it here. See docs/behavioral-analytics.md.
      ANALYTICS_URL: http://analytics:8001
      # Phase 21: rate-limit storage, result cache, and Streams producer. See
      # docs/redis-infrastructure.md.
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  # One-off job: applies Alembic migrations. Not a long-running service.
  # Run explicitly: docker compose run --rm migrate
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.migrate
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]

  # One-off job: generates synthetic source data. Dev/local only — simulates
  # an upstream data-engineering pipeline, never deployed to production.
  # Run explicitly: docker compose run --rm seed
  seed:
    build:
      context: .
      dockerfile: docker/Dockerfile.seed
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]

  # One-off job: runs data-quality checks over the current source data and
  # records results in data_quality_runs/data_quality_check_results. Its own
  # minimal image (no Faker/Alembic — it only runs read queries). Intended to
  # run after any data load, and on a recurring schedule in production (a
  # Kubernetes CronJob in Phase 12) — never as a long-running container.
  # Run explicitly: docker compose run --rm dataquality
  dataquality:
    build:
      context: .
      dockerfile: docker/Dockerfile.dataquality
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]

  # Phase 14: behavioral-event tracking service. Always-on (like api) — it's
  # a live ingestion endpoint, not a one-off job. Independent image/schema
  # from the matching engine by design — see docs/behavioral-analytics.md.
  analytics:
    build:
      context: .
      dockerfile: docker/Dockerfile.analytics
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JME_API_KEY: ${JME_API_KEY}
      # Phase 21: rate-limit storage and Streams consumer group. See
      # docs/redis-infrastructure.md.
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  # One-off job: generates synthetic behavioral events (Phase 14) against the
  # already-seeded candidate/job/course ids. Run after `seed`, not instead of
  # it. Run explicitly: docker compose run --rm analytics-seed
  analytics-seed:
    build:
      context: .
      dockerfile: docker/Dockerfile.analytics
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: ["python", "-m", "app.analytics.generate_synthetic_events"]
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]

  # Phase 15: shared LLM/embedding serving layer. Official, unmodified image —
  # no custom Dockerfile, same pattern as db/prometheus/cadvisor/grafana.
  # Always-on (like api/analytics) — it's a live inference endpoint, not a
  # one-off job. No consumers wired up yet in this phase; see
  # docs/model-serving.md.
  ollama:
    image: ollama/ollama:0.40.13
    ports:
      - "11434:11434"
    gpus: all
    environment:
      # Forces genuine CPU-only inference for the 7B/9B comparison, even
      # though vLLM is stopped and the GPU is otherwise free right now --
      # without this, Ollama (which has `gpus: all` above) would silently
      # grab the GPU for these bigger models too, making the result much
      # faster than intended and not a real CPU baseline.
      CUDA_VISIBLE_DEVICES: ""
      OLLAMA_MAX_LOADED_MODELS: "2"
      # Explicit, not left to Ollama's own memory-based auto-detection --
      # this host's Docker VM caps total memory around 7.4GB shared across
      # every container (see docs/architecture/golden-evaluation-dataset.md),
      # so a conservative fixed value keeps concurrent golden-eval requests
      # from competing for memory Ollama might otherwise over-allocate.
      OLLAMA_NUM_PARALLEL: "5"
      # Default 5m idle-unload meant every one of our earlier concurrency
      # tests paid a real ~20s cold-reload penalty inside the timed window
      # (confirmed via /api/generate's own load_duration field) -- raised
      # so a model loaded once stays warm across an entire batch run. Bumped
      # further (to 4h) for the 7B/9B CPU evals, expected to run for hours.
      OLLAMA_KEEP_ALIVE: "4h"
      OLLAMA_KV_CACHE_TYPE: "q8_0"
      OLLAMA_FLASH_ATTENTION: "true"
      # Real golden CVs/jobs run ~30-60 tokens in our own measurements --
      # far under the 4096/slot Ollama auto-picked. 2048 leaves comfortable
      # headroom while roughly halving per-slot KV-cache memory.
      OLLAMA_CONTEXT_LENGTH: "2048"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Experimental: a purpose-built continuous-batching GPU serving stack,
  # tested as an alternative to Ollama for serving many concurrent
  # extraction requests -- Ollama's own request parallelism plateaued
  # around 5 concurrent calls even on this GPU (40-78% utilization,
  # nowhere near VRAM-limited), pointing at Ollama's serving layer, not
  # the hardware, as the real concurrency ceiling. Not wired into the
  # golden-* pipeline; a standalone comparison target. Downloads its own
  # copy of the model from Hugging Face (different format: safetensors,
  # not Ollama's GGUF) on first run.
  vllm:
    image: vllm/vllm-openai:latest
    gpus: all
    ports:
      - "8000:8000"
    ipc: host
    environment:
      # The model is already fully cached in vllm_hf_cache from prior runs
      # -- without this, startup still hits huggingface.co first to check
      # for updates, and a container-specific DNS resolution failure there
      # (confirmed live: other containers on the same host resolved the
      # same hostname fine) blocked startup entirely despite having
      # everything it needs locally.
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - vllm_hf_cache:/root/.cache/huggingface
    command:
      # Qwen2.5-3B-AWQ is the best-performing model tested (F1 0.7916, see
      # docs/architecture/golden-evaluation-dataset.md): 1.5B/3B-Qwen/3B-Llama
      # all fit and were compared; a quantized 7B (Qwen2.5-7B-Instruct-AWQ)
      # was also tried and genuinely does NOT fit this 8GB card -- confirmed
      # via 3 separate attempts (max-model-len 2048, 1024, and even 256
      # all failed identically with "No available memory for the cache
      # blocks") that the model's own fixed compute/activation overhead
      # alone exceeds the ~1.5GB left after its 5.19GB weights load,
      # independent of context length -- a genuine hardware ceiling, not a
      # tunable config gap.
      - "--model=Qwen/Qwen2.5-3B-Instruct-AWQ"
      - "--gpu-memory-utilization=0.85"
      - "--max-model-len=2048"
    profiles: ["tools"]

  # One-off job: pulls every model the live services actually use into the
  # ollama_data volume. Idempotent — `ollama pull` is a no-op if the model is
  # already present. Run explicitly: docker compose run --rm ollama-pull
  #
  # qwen2.5:1.5b — extraction LLM (promoted in Phase 18 over the original
  #   llama3.2:1b after a measured comparison: F1 0.60-0.66 vs 0.504, smaller
  #   on disk too — see docs/skill-extraction.md). llama3.2:1b itself is no
  #   longer pulled by default; still reproducible via
  #   `docker exec <ollama container> ollama pull llama3.2:1b` if needed.
  # nomic-embed-text — extraction's skill-canonicalization embeddings (Phase 16)
  # all-minilm — Phase 17's production entity-embedding model
  ollama-pull:
    image: ollama/ollama:0.40.13
    entrypoint: ["sh", "-c"]
    command:
      - "ollama pull qwen2.5:1.5b && ollama pull nomic-embed-text && ollama pull all-minilm"
    environment:
      OLLAMA_HOST: ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    profiles: ["tools"]

  # Phase 16: Use Case C skill-extraction service. Always-on (like
  # api/analytics) — a live extraction endpoint, not a one-off job. Calls the
  # ollama service over HTTP; no model weights in this image. See
  # docs/skill-extraction.md.
  extraction:
    build:
      context: .
      dockerfile: docker/Dockerfile.extraction
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JME_API_KEY: ${JME_API_KEY}
      OLLAMA_URL: http://ollama:11434
      # CV upload storage (basic, PDF-only, 2MB cap — docs/skill-extraction.md
      # "CV upload storage"). SeaweedFS's S3-compatible API, not MinIO —
      # MinIO stopped publishing public container images in 2025 (confirmed:
      # `docker pull minio/minio` is refused without login).
      CV_STORAGE_ENDPOINT: seaweedfs:8333
      CV_STORAGE_ACCESS_KEY: ${CV_STORAGE_ACCESS_KEY}
      CV_STORAGE_SECRET_KEY: ${CV_STORAGE_SECRET_KEY}
      CV_STORAGE_BUCKET: candidate-cvs
      # Per-call MLflow tracing (latency, token counts, prompt/response) on
      # extract_skills()/generate()/embed_batch() -- see
      # app/extraction/pipeline.py and ollama_client.py. Fully best-effort
      # (a no-op if unreachable, never breaks a real request) and async
      # (queued/uploaded in a background thread, doesn't add request
      # latency) -- see MLflow's own tracing production guidance.
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: jme-skill-extraction
      MLFLOW_ENABLE_ASYNC_LOGGING: "true"
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Phase 27: minimal end-to-end demo frontend — a thin UI over api/extraction,
  # nothing else (no app/db.py, no ORM, never touches Postgres directly). The
  # one real gap every prior phase left open: the platform was API-only, with
  # no way for a human to click through the flow it's built for. See
  # docs/frontend.md.
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "8501:8501"
    environment:
      # Phase 28: routed through the API Gateway, not called directly. See
      # docker/nginx-gateway/nginx.conf and docs/ingress-layer.md.
      API_URL: http://gateway/matching
      EXTRACTION_URL: http://gateway/extraction
      JME_API_KEY: ${JME_API_KEY}
      # Phase 29: OIDC login gate against Keycloak. Two issuer URLs — the
      # browser redirects to the public one, token exchange happens
      # server-side against the internal one. See docs/sso.md.
      OIDC_PUBLIC_ISSUER: http://localhost:8180/realms/jme
      OIDC_INTERNAL_ISSUER: http://keycloak:8080/realms/jme
      OIDC_REDIRECT_URI: http://localhost:8080/
      # Registration flow (issue #14): least-privilege service-account client
      # used only to assign a candidate/employer realm role after first login.
      KEYCLOAK_ADMIN_CLIENT_ID: jme-admin
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
    depends_on:
      api:
        condition: service_healthy
      extraction:
        condition: service_healthy
      gateway:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Phase 29: real SSO/OIDC login gate for the Frontend (human/browser login
  # only — the existing JME_API_KEY mechanism is unchanged for service-to-
  # service API calls). Dev-mode Keycloak, realm pre-seeded via
  # --import-realm so no manual admin-console setup is needed. See
  # docs/sso.md.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    ports:
      - "8180:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Must match the hardcoded "secret" field on the jme-admin client in
      # jme-realm.json (Keycloak v26's realm-import doesn't resolve ${env.*}
      # placeholders for client secrets) -- kept here only so both are
      # documented together and so the Frontend's copy below is visibly the
      # same value, not because Keycloak itself reads this var.
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
    volumes:
      - ./docker/keycloak/jme-realm.json:/opt/keycloak/data/import/jme-realm.json:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /realms/jme HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q 'HTTP/1.1' <&3"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # Phase 28: API Gateway — sits between App Frontend and the backend APIs it
  # calls (path-based routing, prefix stripped). Not public-facing by design
  # (only loadbalancer is); published anyway for direct debugging, same
  # convention as every other service here. See docs/ingress-layer.md.
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8099:80"
    volumes:
      - ./docker/nginx-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
      extraction:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/matching/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Phase 28: Reverse Proxy — fronts App Frontend only (TLS termination point
  # in a real deployment; no real cert here, local-only). Two identical
  # replicas behind the Load Balancer. Not published to the host — only
  # loadbalancer is the public entry point. See docs/ingress-layer.md.
  reverseproxy-1:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx-reverse-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5

  reverseproxy-2:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx-reverse-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Phase 28: Load Balancer — round-robins across the two Reverse Proxy
  # replicas (nginx default algorithm). The only publicly-reachable ingress
  # component; this is the new way to reach the demo (was :8501 directly
  # through Phase 27). See docs/ingress-layer.md.
  loadbalancer:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx-load-balancer/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      reverseproxy-1:
        condition: service_healthy
      reverseproxy-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # CV upload object storage (Use Case C) — SeaweedFS, open source, S3-
  # compatible, still freely pullable (verified directly; MinIO's own image
  # is not, as of 2025 — see the extraction service's env comment above).
  # `mini` mode bundles master/volume/filer/S3 gateway in one process,
  # appropriate at this project's scale (50-100 candidate CVs, not a
  # distributed storage cluster). Credentials via AWS_* env vars, SeaweedFS's
  # own documented quick-setup path — same `.env`-driven secrets pattern as
  # every other service in this project.
  seaweedfs:
    image: chrislusf/seaweedfs:4.51
    command: ["mini", "-dir=/data"]
    ports:
      - "8333:8333"
    environment:
      AWS_ACCESS_KEY_ID: ${CV_STORAGE_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${CV_STORAGE_SECRET_KEY}
      S3_BUCKET: candidate-cvs
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8333 || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # One-off job: runs the skill-extraction evaluation harness
  # (app/extraction/run_extraction_eval.py) against the golden dataset and
  # logs results to MLflow + Postgres. Run explicitly, with optional
  # overrides: docker compose run --rm extraction-eval
  #   python -m app.extraction.run_extraction_eval --llm-model X --threshold T
  extraction-eval:
    build:
      context: .
      dockerfile: docker/Dockerfile.extraction
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      OLLAMA_URL: http://ollama:11434
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: jme-skill-extraction
    command: ["python", "-m", "app.extraction.run_extraction_eval"]
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
    profiles: ["tools"]

  # One-off job: generates synthetic CV PDFs for every already-seeded
  # candidate that doesn't already have one, uploaded through the exact same
  # path a real user upload hits (app/extraction/document_storage.py). Run
  # after `seed` (needs candidate ids) — requires `seaweedfs` to actually
  # store the bytes. Dummy CVs are never committed to this repo; regenerate
  # the dataset locally by running this job yourself. Run explicitly:
  # docker compose run --rm cv-seed
  cv-seed:
    build:
      context: .
      dockerfile: docker/Dockerfile.cvseed
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CV_STORAGE_ENDPOINT: seaweedfs:8333
      CV_STORAGE_ACCESS_KEY: ${CV_STORAGE_ACCESS_KEY}
      CV_STORAGE_SECRET_KEY: ${CV_STORAGE_SECRET_KEY}
      CV_STORAGE_BUCKET: candidate-cvs
    depends_on:
      db:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    profiles: ["tools"]

  # Phase 17: pgvector/pgvector is a drop-in-compatible build of the same
  # Postgres 16 with the pgvector extension pre-installed (confirmed via
  # Docker Hub's API, not a fork) — not a new vector-DB service, the
  # existing Postgres instance becomes one. See docs/embedding-matching.md.
  # One-off job: computes/refreshes Phase 17 entity embeddings (skills,
  # experience, overall dimensions) for candidates and jobs. Reuses the
  # `extraction` image (already has Ollama access + the skill-embedding
  # cache) rather than a 7th Dockerfile — see docs/embedding-matching.md
  # "Service boundary". Incremental: unchanged entities are skipped via
  # source_hash, not recomputed. Run explicitly, with optional limits for a
  # fast partial pass: docker compose run --rm embeddings-compute
  #   python -m app.embeddings.compute_embeddings --candidate-limit 50 --job-limit 50
  embeddings-compute:
    build:
      context: .
      dockerfile: docker/Dockerfile.extraction
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      OLLAMA_URL: http://ollama:11434
      # Phase 25: invalidates a candidate's job-matches cache the instant
      # their embeddings are recomputed (app/embeddings/cache_invalidation.py).
      # No depends_on/healthcheck coupling to redis — fail-open by design,
      # same as every other Redis integration in this project; this job must
      # still work (just without active invalidation) if redis isn't running.
      REDIS_URL: redis://redis:6379/0
    command: ["python", "-m", "app.embeddings.compute_embeddings"]
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
    profiles: ["tools"]

  # Golden evaluation dataset (app/golden/): 500 of the existing seeded
  # candidates, each given a realistic LLM-written CV, 3 LLM-written paired
  # job postings, a real Keycloak login, and a persona-driven behavioral
  # history — see app/golden/ module docstrings for the full rationale.
  # One shared image (docker/Dockerfile.golden), varied only by `command`,
  # same pattern as extraction-eval/embeddings-compute both reusing
  # Dockerfile.extraction. Run in this order: golden-curated-occupations,
  # golden-cvs, golden-jobs, golden-inject-noise, golden-logins,
  # golden-events, then either eval script.
  # Wipes the existing golden subset before a full v2 regenerate -- see
  # app/golden/wipe_golden_dataset.py's docstring for exact scope (golden
  # CVs/jobs/pairs/eval-runs only, never the base seed pool).
  golden-wipe:
    build:
      context: .
      dockerfile: docker/Dockerfile.golden
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: ["python", "-m", "app.golden.wipe_golden_dataset"]
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]

  golden-curated-occupations:
    build:
      context: .
      dockerfile: docker/Dockerfile.golden
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: ["python", "-m", "app.golden.seed_curated_occupations"]
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]

  # Selects N candidates and assigns each to one of the new curated
  # occupations (round-robin, even spread), regenerating their skill
  # profile to match -- see app/golden/select.py's
  # select_and_assign_golden_candidates. Run after golden-curated-
  # occupations, before golden-cvs/golden-jobs. Pass --n to override 1000.
  golden-assign-candidates:
    build:
      context: .
      dockerfile: docker/Dockerfile.golden
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: ["python", "-m", "app.golden.select"]
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]

  golden-cvs:
    build:
      context: .
      dockerfile: docker/Dockerfile.golden
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      OLLAMA_URL: http://ollama:11434
      VLLM_URL: http://vllm:8000
      # Must match whichever model vLLM's own --model= is currently serving
      # -- vllm_client.py sends this exact string in each request's "model"
      # field, but it's ignored server-side (vLLM serves one model per
      # process) when --backend vllm is used.
      VLLM_MODEL: "Qwen/Qwen2.5-3B-Instruct-AWQ"
      CV_STORAGE_ENDPOINT: seaweedfs:8333
      CV_STORAGE_ACCESS_KEY: ${CV_STORAGE_ACCESS_KEY}
      CV_STORAGE_SECRET_KEY: ${CV_STORAGE_SECRET_KEY}
    command: ["python", "-m", "app.golden.generate_cvs"]
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      # No healthcheck on `vllm` -- only waits for container start, not
      # model load. See golden-extraction-eval's note on this same gap.
      vllm:
        condition: service_started
    profiles: ["tools"]

  golden-jobs:
    build:
      context: .
      dockerfile: docker/Dockerfile.golden
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      OLLAMA_URL: http://ollama:11434
      VLLM_URL: http://vllm:8000
      VLLM_MODEL: "Qwen/Qwen2.5-3B-Instruct-AWQ"
    command: ["python", "-m", "app.golden.generate_jobs"]
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
      vllm:
        condition: service_started
    profiles: ["tools"]

  # golden-dataset v2: deliberately injects 1-2 unrelated "noise" skills into
  # ~10% of golden candidates'/jobs' ground truth, AFTER their CV/job text
  # is already written (never regenerated afterward) -- see
  # app/golden/inject_noise.py and golden_injected_noise. Run after
  # golden-cvs/golden-jobs, before golden-extraction-eval.
  golden-inject-noise:
    build:
      context: .
      dockerfile: docker/Dockerfile.golden
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: ["python", "-m", "app.golden.inject_noise"]
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]

  golden-logins:
    build:
      context: .
      dockerfile: docker/Dockerfile.golden
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      OIDC_INTERNAL_ISSUER: http://keycloak:8080/realms/jme
      KEYCLOAK_ADMIN_CLIENT_ID: jme-admin
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
    command: ["python", "-m", "app.golden.provision_logins"]
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    profiles: ["tools"]

  golden-events:
    build:
      context: .
      dockerfile: docker/Dockerfile.golden
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: ["python", "-m", "app.golden.generate_persona_events"]
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]

  golden-extraction-eval:
    build:
      context: .
      dockerfile: docker/Dockerfile.golden
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      OLLAMA_URL: http://ollama:11434
      VLLM_URL: http://vllm:8000
      # Must match whichever model vLLM's own --model= is currently serving
      # (see the vllm service's command above) -- vllm_client.py sends this
      # exact string in each request's "model" field.
      VLLM_MODEL: "Qwen/Qwen2.5-3B-Instruct-AWQ"
      CV_STORAGE_ENDPOINT: seaweedfs:8333
      CV_STORAGE_ACCESS_KEY: ${CV_STORAGE_ACCESS_KEY}
      CV_STORAGE_SECRET_KEY: ${CV_STORAGE_SECRET_KEY}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: jme-skill-extraction
    command: ["python", "-m", "app.golden.run_extraction_eval"]
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      # `vllm` has no healthcheck defined, so this only waits for the
      # container to start, not for the model to finish loading (that took
      # real, observed minutes this session) -- a genuine gap, previously
      # missing here entirely. True readiness still needs an external wait
      # (e.g. polling for "Application startup complete" in its logs, same
      # as this session's manual recovery did) before calling --backend vllm.
      vllm:
        condition: service_started
    profiles: ["tools"]

  golden-recommendation-eval:
    build:
      context: .
      dockerfile: docker/Dockerfile.golden
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: ["python", "-m", "app.golden.run_recommendation_eval"]
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]

  # Decomposition-tree ("drill-down") report over a golden-eval run: overall
  # F1 -> profession domain -> occupation, separately for candidates (500)
  # and job posts (1500). Writes a single self-contained Plotly HTML file,
  # no server needed -- see app/golden/build_evaluation_tree.py's docstring.
  # Pass --run-id if the default (best-scoring 2000-sample run) isn't right.
  golden-eval-tree:
    build:
      context: .
      dockerfile: docker/Dockerfile.golden
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: ["python", "-m", "app.golden.build_evaluation_tree"]
    volumes:
      - ./data/golden/reports:/app/data/golden/reports
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]

  # Backs up/restores the expensive (LLM-generated) part of the golden
  # dataset -- the 500 CVs and 1500 job postings -- to a local, git-ignored
  # directory, so a wiped Docker volume doesn't require ~2,000 Ollama calls
  # again. See app/golden/export_backup.py's docstring for exact scope.
  golden-export:
    build:
      context: .
      dockerfile: docker/Dockerfile.golden
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CV_STORAGE_ENDPOINT: seaweedfs:8333
      CV_STORAGE_ACCESS_KEY: ${CV_STORAGE_ACCESS_KEY}
      CV_STORAGE_SECRET_KEY: ${CV_STORAGE_SECRET_KEY}
    command: ["python", "-m", "app.golden.export_backup"]
    volumes:
      - ./data/golden/backup:/app/data/golden/backup
    depends_on:
      db:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    profiles: ["tools"]

  golden-restore:
    build:
      context: .
      dockerfile: docker/Dockerfile.golden
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CV_STORAGE_ENDPOINT: seaweedfs:8333
      CV_STORAGE_ACCESS_KEY: ${CV_STORAGE_ACCESS_KEY}
      CV_STORAGE_SECRET_KEY: ${CV_STORAGE_SECRET_KEY}
    command: ["python", "-m", "app.golden.restore_backup"]
    volumes:
      - ./data/golden/backup:/app/data/golden/backup
    depends_on:
      db:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    profiles: ["tools"]

  # Phase 21: shared Redis instance serving three use cases — rate-limiting
  # backend (fixes Phase 18's measured multi-worker counter-inflation bug),
  # 1-hour result cache (cache-aside on the matching endpoints), and the
  # Streams broker decoupling the analytics instrumentation hook from a
  # synchronous HTTP call. One instance for all three in v1, not three
  # separate deployments — see docs/redis-infrastructure.md.
  redis:
    image: redis:7.4.12-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  db:
    image: pgvector/pgvector:0.8.7-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - jme_db_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jme -d jme"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Always-on service (like api/db) — experiment tracking UI/API must be
  # reachable at any time to browse past evaluation runs, not a one-off job.
  # Backend store: a dedicated "mlflow" Postgres database (same instance,
  # separate from "jme" — see docker/postgres-init/01-create-mlflow-db.sql).
  mlflow:
    build:
      context: .
      dockerfile: docker/Dockerfile.mlflow
    ports:
      - "5000:5000"
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${MLFLOW_DB_NAME}
    volumes:
      - mlflow_artifacts:/mlflow-artifacts
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000')"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Phase 9 observability. Always-on (like mlflow) — needs to be continuously
  # scraping, not a one-off job. Scrapes the api's /metrics (latency/
  # error-rate, from prometheus-fastapi-instrumentator) and cadvisor
  # (per-container CPU/RAM) — covers the brief's "CPU/RAM/latency/error-rate
  # measurable" requirement without hand-rolling container resource metrics.
  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api
      - analytics
      - extraction
      - cadvisor

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    ports:
      - "8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    privileged: true

  grafana:
    image: grafana/grafana:11.3.1
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # Product-analytics dashboard (behavioral_events/entity_change_log)
      # reads straight from Postgres via Grafana's built-in Postgres data
      # source — see docker/grafana/provisioning/datasources/postgres.yml.
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - db

  # Phase 30: log aggregation backend — single-process, filesystem storage,
  # no clustering (appropriate at this project's scale). Grafana queries it
  # as a second datasource alongside Prometheus (single pane of glass,
  # per docs/observability.md's original Roadmap reasoning). See
  # docs/logging.md.
  loki:
    image: grafana/loki:3.2.1
    ports:
      - "3100:3100"
    volumes:
      - ./docker/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Phase 30: discovers every container via the Docker socket and tails its
  # stdout (the JSON lines app/common/logging.py now emits), shipping to
  # Loki. No app-side network call to log anything — stdout is still the
  # only transport, same convention as before this phase.
  promtail:
    image: grafana/promtail:3.2.1
    volumes:
      - ./docker/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: ["-config.file=/etc/promtail/config.yml"]
    depends_on:
      loki:
        condition: service_healthy

  # Phase 19: knowledge graph linking candidates/skills/occupations/jobs/
  # courses. Official image, GDS plugin auto-installed at container start
  # (verified real, not assumed — see docs/knowledge-graph.md). Always-on
  # (like ollama) — Neo4j Browser needs to be reachable to explore the
  # graph, not just during a batch job.
  neo4j:
    image: neo4j:5.26.32-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["graph-data-science"]'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # One-off job: idempotent batch sync from Postgres into the Neo4j graph.
  # Run explicitly: docker compose run --rm graph-sync
  graph-sync:
    build:
      context: .
      dockerfile: docker/Dockerfile.graph
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    profiles: ["tools"]

  # One-off job: skill co-occurrence clustering via Neo4j GDS (run after
  # graph-sync). Run explicitly: docker compose run --rm graph-cluster
  graph-cluster:
    build:
      context: .
      dockerfile: docker/Dockerfile.graph
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
    command: ["python", "-m", "app.graph.cluster_skills"]
    depends_on:
      neo4j:
        condition: service_healthy
    profiles: ["tools"]

  # One-off job: Phase 23 candidate/job skill-similarity clustering via
  # Neo4j GDS (run after graph-sync) — same Louvain pattern as graph-cluster,
  # one level up (candidates/jobs, not skills). See docs/knowledge-graph.md.
  # Run explicitly: docker compose run --rm graph-cluster-entities
  graph-cluster-entities:
    build:
      context: .
      dockerfile: docker/Dockerfile.graph
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
    command: ["python", "-m", "app.graph.cluster_entities"]
    depends_on:
      neo4j:
        condition: service_healthy
    profiles: ["tools"]

volumes:
  jme_db_data:
  mlflow_artifacts:
  prometheus_data:
  grafana_data:
  ollama_data:
  vllm_hf_cache:
  neo4j_data:
  redis_data:
  seaweedfs_data:
  loki_data:
