name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # A live Postgres service container, not just pure-logic tests: closes the
  # "rank.py orchestration and route-level API behavior have zero automated
  # tests" gap (docs/production-readiness.md) by actually running
  # tests/matching/test_rank_db.py and tests/api/test_routes_db.py against a
  # real database in CI, not just locally. pgvector-enabled because
  # alembic/env.py imports app.embeddings.models, which needs the `vector`
  # extension to exist before migrations can run.
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_USER: jme
          POSTGRES_PASSWORD: jme_dev_password
          POSTGRES_DB: jme
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jme -d jme"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r app/requirements-dev.txt
      - run: python -m ruff check .
      - name: Run migrations against the CI Postgres service
        run: python -m alembic upgrade head
      - run: python -m pytest tests/ -q

  # Builds every service image and scans it for known vulnerabilities.
  # Report-only for now (exit-code 0): no findings have been triaged yet, so
  # turning this into a hard gate immediately would mean failing builds on
  # base-image CVEs nobody has looked at. Tightening this into an actual gate
  # (e.g. fail on CRITICAL) is a follow-up once there's a known-acceptable
  # baseline — see docs/security-and-threat-model.md.
  build-and-scan:
    needs: lint-and-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [api, migrate, seed, dataquality, mlflow, analytics, extraction, graph]
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.image }} image
        run: docker build -f docker/Dockerfile.${{ matrix.image }} -t match-engine-${{ matrix.image }}:ci .
      - name: Scan ${{ matrix.image }} image (Trivy, report-only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: match-engine-${{ matrix.image }}:ci
          severity: "CRITICAL,HIGH"
          exit-code: "0"
          format: "table"

  # The whole point: prove the stack comes up clean from nothing, the same
  # way a fresh checkout would. Phase 7 found two real bugs (a stale profiled
  # image, a missing Dockerfile COPY) that only a from-zero run like this
  # catches — see docs/progress.md Phase 7 for the write-up. This job exists
  # so those can't silently regress again.
  fresh-volume-smoke-test:
    needs: build-and-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write CI env file
        run: cp .env.example .env
      - name: Build every service image (including profiled tools)
        run: docker compose --profile tools build
      - name: Start db
        run: docker compose up -d db
      - name: Wait for db healthy
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' jme-db-1 2>/dev/null || echo "starting")
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          echo "db never became healthy" && docker compose logs db && exit 1
      - name: Run migrations
        run: docker compose run --rm migrate
      - name: Confirm all tables exist
        run: |
          count=$(docker exec jme-db-1 psql -U jme -d jme -t -c "select count(*) from information_schema.tables where table_schema='public';")
          echo "table count: $count"
          [ "$(echo $count | xargs)" = "20" ]
      - name: Seed synthetic data
        run: docker compose run --rm seed
      - name: Confirm seeded row counts
        run: |
          candidates=$(docker exec jme-db-1 psql -U jme -d jme -t -c "select count(*) from candidates;" | xargs)
          jobs=$(docker exec jme-db-1 psql -U jme -d jme -t -c "select count(*) from jobs;" | xargs)
          echo "candidates=$candidates jobs=$jobs"
          [ "$candidates" = "2000" ] && [ "$jobs" = "1000" ]
      - name: Run data quality checks
        run: docker compose run --rm dataquality
      - name: Generate synthetic behavioral events (Phase 14)
        run: docker compose run --rm analytics-seed
      - name: Confirm behavioral events were generated
        run: |
          count=$(docker exec jme-db-1 psql -U jme -d jme -t -c "select count(*) from analytics.behavioral_events;" | xargs)
          echo "behavioral_events=$count"
          [ "$count" -gt "0" ]
      - name: Start api, analytics, and mlflow
        run: docker compose up -d api analytics mlflow
      - name: Wait for api, analytics, and mlflow healthy
        run: |
          for svc in jme-api-1 jme-analytics-1 jme-mlflow-1; do
            for i in $(seq 1 30); do
              status=$(docker inspect -f '{{.State.Health.Status}}' "$svc" 2>/dev/null || echo "starting")
              [ "$status" = "healthy" ] && break
              sleep 2
            done
            [ "$status" = "healthy" ] || { echo "$svc never became healthy"; docker compose logs; exit 1; }
          done
      - name: Smoke-test the API (health, auth, real data)
        run: |
          set -e
          api_key=$(grep '^JME_API_KEY=' .env | cut -d= -f2)
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/health)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/candidates/1/job-matches)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "X-API-Key: $api_key" http://localhost:8000/candidates/1/job-matches)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/metrics)" = "200"
      - name: Smoke-test the analytics API (health, auth, ingest)
        run: |
          set -e
          api_key=$(grep '^JME_API_KEY=' .env | cut -d= -f2)
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8001/health)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8001/events -H 'Content-Type: application/json' -d '{"actor_type":"candidate","actor_id":1,"event_type":"login"}')" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8001/events -H "X-API-Key: $api_key" -H 'Content-Type: application/json' -d '{"actor_type":"candidate","actor_id":1,"event_type":"login"}')" = "201"
      - name: Smoke-test Phase 24 engagement segmentation (real synthetic events)
        run: |
          set -e
          api_key=$(grep '^JME_API_KEY=' .env | cut -d= -f2)
          response=$(curl -s -H "X-API-Key: $api_key" "http://localhost:8001/actors/candidate/2/segment")
          echo "$response"
          echo "$response" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['segment'] in ('active_seeker','passive_seeker','dormant'); assert 'conversion_rate' in d; print('segmentation ok:', d['segment'])"
      - name: Confirm the matching API's instrumentation hook reaches analytics via Redis Streams
        run: |
          set -e
          # Phase 21: this hook now publishes via XADD instead of a synchronous
          # HTTP POST (docs/redis-infrastructure.md "Use case 3") — the
          # analytics service's background consumer (app/analytics/
          # stream_consumer.py) picks it up asynchronously, so give it a
          # couple of seconds rather than asserting instant delivery.
          api_key=$(grep '^JME_API_KEY=' .env | cut -d= -f2)
          before=$(docker exec jme-db-1 psql -U jme -d jme -t -c "select count(*) from analytics.behavioral_events where source='api';" | xargs)
          curl -s -o /dev/null -H "X-API-Key: $api_key" http://localhost:8000/candidates/2/job-matches
          sleep 3
          after=$(docker exec jme-db-1 psql -U jme -d jme -t -c "select count(*) from analytics.behavioral_events where source='api';" | xargs)
          echo "before=$before after=$after"
          [ "$after" -gt "$before" ]
      - name: Smoke-test Phase 21 result caching (X-Cache header)
        run: |
          set -e
          api_key=$(grep '^JME_API_KEY=' .env | cut -d= -f2)
          first=$(curl -s -D - -o /dev/null -H "X-API-Key: $api_key" "http://localhost:8000/candidates/3/job-matches" | grep -i '^x-cache:' | tr -d '\r')
          second=$(curl -s -D - -o /dev/null -H "X-API-Key: $api_key" "http://localhost:8000/candidates/3/job-matches" | grep -i '^x-cache:' | tr -d '\r')
          echo "first=$first second=$second"
          echo "$first" | grep -qi 'MISS'
          echo "$second" | grep -qi 'HIT'
      - name: Smoke-test Phase 21 Redis-backed rate limiting (shared counter across worker processes)
        run: |
          set -e
          # Phase 18 found slowapi's default in-memory storage gives each of
          # api's 4 uvicorn worker processes an independent counter — 150
          # rapid requests let ~122 through before 429s, not a clean 100. With
          # REDIS_URL set (docker-compose.yml), all 4 workers share one Redis
          # counter instead, keyed by X-API-Key (see app/api/rate_limit.py) —
          # the same key this job's earlier steps already called with, so the
          # bound checked here is "never more than 100", not an exact count:
          # a few quota units are already spent by the time this step runs.
          # See docs/redis-infrastructure.md "Use case 1".
          api_key=$(grep '^JME_API_KEY=' .env | cut -d= -f2)
          ok=0
          limited=0
          for i in $(seq 1 150); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "X-API-Key: $api_key" "http://localhost:8000/candidates/4/job-matches")
            [ "$code" = "200" ] && ok=$((ok+1))
            [ "$code" = "429" ] && limited=$((limited+1))
          done
          echo "200s=$ok 429s=$limited"
          [ "$ok" -gt 0 ] && [ "$ok" -le 100 ] && [ "$limited" -gt 0 ]
      - name: Start ollama (Phase 15 shared model-serving layer)
        run: docker compose up -d ollama
      - name: Wait for ollama healthy
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' jme-ollama-1 2>/dev/null || echo "starting")
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          echo "ollama never became healthy" && docker compose logs ollama && exit 1
      - name: Pull the models the live services use
        run: docker compose run --rm ollama-pull
      - name: Confirm all three models are present
        run: |
          models=$(docker exec jme-ollama-1 ollama list)
          echo "$models"
          echo "$models" | grep -q "qwen2.5:1.5b"
          echo "$models" | grep -q "nomic-embed-text"
          echo "$models" | grep -q "all-minilm"
      - name: Smoke-test real inference (generate + embeddings)
        run: |
          set -e
          response=$(curl -s http://localhost:11434/api/generate -d '{"model":"qwen2.5:1.5b","prompt":"Say OK.","stream":false}')
          echo "$response" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d.get('response'); print('generate ok:', d['response'][:80])"
          embedding=$(curl -s http://localhost:11434/api/embeddings -d '{"model":"nomic-embed-text","prompt":"test"}')
          echo "$embedding" | python3 -c "import sys,json; d=json.load(sys.stdin); assert len(d['embedding']) == 768; print('embeddings ok: 768-dim vector')"
      - name: Start extraction service (Use Case C, Phase 16)
        run: docker compose up -d extraction
      - name: Wait for extraction healthy
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' jme-extraction-1 2>/dev/null || echo "starting")
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          echo "extraction never became healthy" && docker compose logs extraction && exit 1
      - name: Smoke-test real skill extraction (auth + real pipeline call)
        run: |
          set -e
          api_key=$(grep '^JME_API_KEY=' .env | cut -d= -f2)
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8002/extract -H 'Content-Type: application/json' -d '{"text":"Python required."}')" = "401"
          response=$(curl -s -X POST http://localhost:8002/extract -H "X-API-Key: $api_key" -H 'Content-Type: application/json' -d '{"text":"The ideal candidate must have strong experience with Python."}')
          echo "$response"
          echo "$response" | python3 -c "import sys,json; d=json.load(sys.stdin); m=d['matches']; assert len(m) >= 1 and any(x['requirement_level']=='required' for x in m), 'expected a required match'; print('extraction ok:', m)"
      - name: Compute a sample of embeddings (Phase 17 — all-minilm already pulled above)
        run: docker compose run --rm embeddings-compute python -m app.embeddings.compute_embeddings --candidate-limit 10 --job-limit 30
      - name: Confirm embeddings were stored
        run: |
          count=$(docker exec jme-db-1 psql -U jme -d jme -t -c "select count(*) from entity_embeddings;" | xargs)
          echo "entity_embeddings=$count"
          [ "$count" -gt "0" ]
      - name: Smoke-test the semantic job-matches endpoint (real pgvector ANN retrieval)
        run: |
          set -e
          api_key=$(grep '^JME_API_KEY=' .env | cut -d= -f2)
          response=$(curl -s -H "X-API-Key: $api_key" "http://localhost:8000/candidates/1/job-matches/semantic?top_k=3")
          echo "$response"
          echo "$response" | python3 -c "import sys,json; d=json.load(sys.stdin); assert len(d) >= 1, 'expected at least one semantic match'; assert 'skills_similarity' in d[0]; print('semantic matching ok:', d)"
      - name: Start neo4j (Phase 19 knowledge graph)
        run: docker compose up -d neo4j
      - name: Wait for neo4j healthy
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' jme-neo4j-1 2>/dev/null || echo "starting")
            [ "$status" = "healthy" ] && exit 0
            sleep 3
          done
          echo "neo4j never became healthy" && docker compose logs neo4j && exit 1
      - name: Sync the knowledge graph from Postgres
        run: docker compose run --rm graph-sync
      - name: Confirm graph nodes/edges were created
        run: |
          set -e
          pass=$(grep '^NEO4J_PASSWORD=' .env | cut -d= -f2)
          counts=$(docker exec jme-neo4j-1 cypher-shell -u neo4j -p "$pass" "MATCH (n) RETURN count(n) AS nodes;")
          echo "$counts"
          echo "$counts" | tail -1 | grep -qv "^0$"
      - name: Run skill clustering via Neo4j GDS
        run: docker compose run --rm graph-cluster
      - name: Start observability stack (prometheus, cadvisor, grafana)
        run: docker compose up -d prometheus cadvisor grafana
      - name: Verify prometheus is scraping the api and analytics services
        run: |
          for job in api analytics extraction; do
            ok=""
            for i in $(seq 1 15); do
              health=$(curl -s "http://localhost:9090/api/v1/query?query=up%7Bjob%3D%22$job%22%7D" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d['data']['result'][0]['value'][1] if d['data']['result'] else '')" 2>/dev/null || true)
              [ "$health" = "1" ] && ok=1 && break
              sleep 2
            done
            [ "$ok" = "1" ] || { echo "prometheus never reported $job target as up"; exit 1; }
          done
      - name: Tear down
        if: always()
        run: docker compose --profile tools down -v
