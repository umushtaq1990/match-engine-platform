# Phase 28: API Gateway — sits between App Frontend and the backend APIs it
# calls (matching_api, extraction_api). Not public-facing by design (only the
# Load Balancer is); published to the host anyway for direct debugging, same
# convention as every other service in this repo. Path prefix is stripped by
# the trailing slash on both `location` and `proxy_pass`, so api/extraction
# see the exact paths they always have — no changes needed in those
# services. See docs/ingress-layer.md.
events {}

http {
    server {
        listen 80;

        location /matching/ {
            proxy_pass http://api:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /extraction/ {
            proxy_pass http://extraction:8002/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
