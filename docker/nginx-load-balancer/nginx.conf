# Phase 28: Load Balancer — the only publicly-reachable ingress component
# (reverseproxy-1/-2 and gateway are internal-only, reached by compose service
# name). Round-robins across the two Reverse Proxy replicas (nginx's default
# algorithm — no directive needed). X-Upstream lets round-robin be verified
# by curling repeatedly and watching the header alternate, rather than
# assumed. See docs/ingress-layer.md.
events {}

http {
    upstream reverse_proxies {
        server reverseproxy-1:80;
        server reverseproxy-2:80;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://reverse_proxies;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            add_header X-Upstream $upstream_addr always;
        }
    }
}
