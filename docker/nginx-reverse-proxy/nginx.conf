# Phase 28: Reverse Proxy — fronts the App Frontend container only (not the
# APIs; that's the Gateway's job, see docker/nginx-gateway/nginx.conf). Two
# replicas of this exact config run behind the Load Balancer
# (docker/nginx-load-balancer/nginx.conf). Websocket passthrough is required —
# Streamlit's live UI updates depend on it. See docs/ingress-layer.md.
events {}

http {
    server {
        listen 80;

        location / {
            proxy_pass http://frontend:8501;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
