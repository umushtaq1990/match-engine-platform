global:
  scrape_interval: 10s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8000"]

  - job_name: analytics
    static_configs:
      - targets: ["analytics:8001"]

  - job_name: extraction
    static_configs:
      - targets: ["extraction:8002"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
