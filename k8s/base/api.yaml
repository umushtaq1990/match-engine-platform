# 2 replicas by default - ADR 0001 named this as the payoff of decoupling
# ingestion/migrate/api into separate images: "api becomes a horizontally
# scalable Deployment." Proven here by actually running 2 pods behind one
# Service, not just asserted.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jme-api
  namespace: jme
spec:
  replicas: 2
  selector:
    matchLabels: { app: jme-api }
  template:
    metadata:
      labels: { app: jme-api }
    spec:
      containers:
        - name: api
          image: jme-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef: { name: jme-secrets }
          readinessProbe:
            httpGet: { path: /readiness, port: 8000 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: jme-api
  namespace: jme
spec:
  selector: { app: jme-api }
  ports:
    - port: 8000
      targetPort: 8000
---
# Demonstrates understanding of production scaling, even though it's
# effectively a no-op at this exercise's traffic levels - metrics-server
# isn't installed on this local kind cluster (a real addition, not part of
# kind by default), so this HPA is applied but won't actually scale here;
# documented as a known gap in docs/kubernetes.md rather than silently
# included as if it were verified working end-to-end.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: jme-api
  namespace: jme
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: jme-api
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
