apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: jme
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jme-db
  namespace: jme
spec:
  replicas: 1
  strategy:
    type: Recreate # single ReadWriteOnce volume - never run 2 postgres pods
  selector:
    matchLabels: { app: jme-db }
  template:
    metadata:
      labels: { app: jme-db }
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef: { name: jme-secrets }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "jme", "-d", "jme"] }
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata # avoid postgres's "directory not empty" complaint about lost+found
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: postgres-data }
        - name: init-scripts
          configMap: { name: postgres-init }
---
apiVersion: v1
kind: Service
metadata:
  name: jme-db
  namespace: jme
spec:
  selector: { app: jme-db }
  ports:
    - port: 5432
      targetPort: 5432
