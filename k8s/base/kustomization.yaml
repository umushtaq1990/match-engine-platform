apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# secret.yaml is git-ignored (same pattern as .env) - generate it first, see
# docs/kubernetes.md or secret.example.yaml for the command. `kubectl apply
# -k` against this base (or an overlay) fails with a clear "not found" error
# until that file exists, rather than silently using placeholder secrets.
resources:
  - namespace.yaml
  - secret.yaml
  - configmaps.yaml
  - postgres.yaml
  - jobs.yaml
  - cronjob-dataquality.yaml
  - api.yaml
  - mlflow.yaml
  - prometheus.yaml
  - grafana.yaml
