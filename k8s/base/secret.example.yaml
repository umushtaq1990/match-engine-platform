# Template only — copy to secret.yaml (git-ignored, same pattern as .env)
# and fill in real values, or generate directly from .env (see
# docs/kubernetes.md for the full command used to produce the real
# k8s/base/secret.yaml this repo runs against locally). Connection strings
# are pre-composed here (DATABASE_URL, MLFLOW_BACKEND_STORE_URI) since K8s
# Secrets don't support Compose-style ${VAR} interpolation.
apiVersion: v1
kind: Secret
metadata:
  name: jme-secrets
  namespace: jme
stringData:
  POSTGRES_USER: jme
  POSTGRES_PASSWORD: dev-local-password-change-me
  POSTGRES_DB: jme
  MLFLOW_DB_NAME: mlflow
  JME_API_KEY: dev-local-key-change-me
  GRAFANA_ADMIN_PASSWORD: dev-local-password-change-me
  DATABASE_URL: postgresql+psycopg2://jme:dev-local-password-change-me@jme-db:5432/jme
  MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://jme:dev-local-password-change-me@jme-db:5432/mlflow
  MLFLOW_TRACKING_URI: http://jme-mlflow:5000
