# On Azure, Postgres is Azure Database for PostgreSQL Flexible Server
# (managed, not a pod we run ourselves) - these 3 resources from base/ are
# removed; DATABASE_URL in the (environment-specific, never-committed)
# secret would point at the managed server's hostname instead of jme-db.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jme-db
  namespace: jme
$patch: delete
---
apiVersion: v1
kind: Service
metadata:
  name: jme-db
  namespace: jme
$patch: delete
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: jme
$patch: delete
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: jme
$patch: delete
